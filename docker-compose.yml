
services:

  db:
    image: postgres:16
    container_name: smartlock-db
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: smartlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
